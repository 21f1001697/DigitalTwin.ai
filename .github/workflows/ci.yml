name: CI

on:
  push:
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package
        run: |
          cd packages/digitaltwin_core
          pip install -e . pytest
      - name: Run tests
        run: |
          cd packages/digitaltwin_core
          pytest -v
